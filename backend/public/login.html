<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - Estaciones Meteorológicas</title>
  <link rel="stylesheet" href="src/css/globals/globals.css">
  <link rel="stylesheet" href="src/css/styleguide/styleguide-login.css">
  <link rel="stylesheet" href="src/css/styles/styles-login.css">
</head>
<body data-color-mode="SDS-light">
<div class="login-container">
  <img class="background" src="src/img/background-login.jpg"  alt=""/>
  <div class="login-box">
    <div class="titulo">
      <h1>ESTACIONES METEOROLÓGICAS</h1>
      <h2>Iniciar Sesión</h2>
    </div>
    <form action="/login" method="POST">
      <div class="input-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Ingrese su email" required>
      </div>
      <div class="input-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="Ingrese su contraseña" required>
      </div>
      <button type="submit" class="btn">Iniciar Sesión</button>
    </form>
  </div>
</div>

</body>
</html>
