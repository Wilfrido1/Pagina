        <script>
          window.jsPDF = window.jspdf.jsPDF;
        
          document.addEventListener("DOMContentLoaded", async () => {
          const modal = document.querySelector('#modal');
          const openModal = document.querySelector('.btncrearreporte');
          const closeModal = document.querySelector('.close-button');
          const guardarDatos = document.querySelector('#guardar-datos');
          const loadingElement = document.getElementById('loading');
          const tablaAlertas = document.getElementById('tabla-alertas');
          const selectEstacion = document.getElementById('estacion');

          // Cargar estaciones al abrir el modal
          async function cargarEstaciones() {
            try {
              const response = await fetch('/estaciones');
              const estaciones = await response.json();
              selectEstacion.innerHTML = '<option value="">Selecciona una estación</option>';
              estaciones.forEach(est => {
                const option = document.createElement('option');
                option.value = est.id_estacion;;
                option.textContent = est.nombre;
                selectEstacion.appendChild(option);
              });
            } catch (err) {
              console.error('Error cargando estaciones:', err);
            }
          }

          if (openModal && modal) {
            openModal.addEventListener('click', () => {
              cargarEstaciones();
              modal.showModal();
            });
          }

          if (closeModal && modal) {
            closeModal.addEventListener('click', () => modal.close());
          }

          if (guardarDatos) {
            guardarDatos.addEventListener('click', async () => {
              const nombre = document.querySelector('#nombre').value;
              const fechaInicio = document.querySelector('#fecha-inicio').value;
              const fechaFinal = document.querySelector('#fecha-final').value;
              const estacionId = selectEstacion.value;


              if (!nombre || !fechaInicio || !fechaFinal || !estacionId) {
                alert("Por favor, completa todos los campos.");
                return;
              }

              if (loadingElement) loadingElement.style.display = 'block';

              try {
                console.log("Estación seleccionada:", estacionId);
                const url = `/api/promedioFecha?idEstacion=${estacionId}&fechaInicio=${fechaInicio}&fechaFinal=${fechaFinal}`;
                console.log("URL de la solicitud:", url);
                const response = await fetch(url);

                if (!response.ok) throw new Error('Error en la solicitud: ' + response.statusText);

                const data = await response.json();

                if (data && data.promedios) {
                  const savedReports = JSON.parse(localStorage.getItem('savedReports')) || [];
                  const newReport = {
                    id_reporte: Date.now(),
                    nombre,
                    fecha_creacion: new Date().toLocaleDateString(),
                    fecha_inicio: fechaInicio,
                    fecha_final: fechaFinal,
                    estacion: data.estacion,
                    promedios: data.promedios
                  };
                  savedReports.push(newReport);
                  updateTable(savedReports);
                } else {
                  alert("No se encontraron datos para esta estación y rango de fechas.");
                }
              } catch (error) {
                console.error('Error al obtener el resumen del reporte:', error);
                alert("Error al generar el reporte: " + error.message);
              } finally {
                if (loadingElement) loadingElement.style.display = 'none';
                modal.close();
              }
            });
          }

          if (tablaAlertas) {
            tablaAlertas.addEventListener('click', function(event) {
              if (event.target && event.target.tagName === 'BUTTON' && event.target.textContent === 'Eliminar') {
                const reportId = event.target.dataset.id;
                deleteReport(reportId);
              }
            });
          }

          const savedReports = JSON.parse(localStorage.getItem('savedReports')) || [];
          updateTable(savedReports);
        });

        function updateTable(data) {
          const tableBody = document.getElementById('tabla-alertas');
          if (!tableBody) return;

          tableBody.innerHTML = "";

          data.forEach((item) => {
            const row = document.createElement('tr');
            row.className = 'bg-white border-b dark:bg-darkblack-500 dark:border-darkblack-400';

            const nameCell = document.createElement('td');
            nameCell.textContent = item.nombre;
            nameCell.className = 'px-6 py-4 font-medium text-bgray-700 dark:text-white whitespace-nowrap';
            row.appendChild(nameCell);

            const idCell = document.createElement('td');
            idCell.textContent = item.id_reporte;
            idCell.className = 'px-6 py-4 text-bgray-500 dark:text-bgray-200';
            row.appendChild(idCell);

            const dateCell = document.createElement('td');
            dateCell.textContent = item.fecha_creacion;
            dateCell.className = 'px-6 py-4 text-bgray-500 dark:text-bgray-200';
            row.appendChild(dateCell);

            const downloadCell = document.createElement('td');
            downloadCell.className = 'px-6 py-4';
            const downloadButton = document.createElement('button');
            downloadButton.textContent = "Descargar PDF";
            downloadButton.className = "rounded bg-success-300 px-3 py-2 text-white text-xs hover:bg-success-400 transition";
            downloadButton.onclick = () => generatePDF(item);
            downloadCell.appendChild(downloadButton);
            row.appendChild(downloadCell);

            const deleteCell = document.createElement('td');
            deleteCell.className = 'px-6 py-4';
            const deleteButton = document.createElement('button');
            deleteButton.textContent = "Eliminar";
            deleteButton.className = "rounded bg-error-300 px-3 py-2 text-white text-xs hover:bg-error-400 transition";
            deleteButton.dataset.id = item.id_reporte;
            deleteCell.appendChild(deleteButton);
            row.appendChild(deleteCell);

            tableBody.appendChild(row);
          });

          localStorage.setItem('savedReports', JSON.stringify(data));
        }

        function generatePDF(report) {
          try {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            const formatDate = (dateString) => new Date(dateString).toLocaleDateString('es-ES');

            doc.setFontSize(20);
            doc.text(`Reporte: ${report.nombre}`, 105, 20, { align: 'center' });

            doc.setFontSize(14);
            doc.text(`Estación: ${report.estacion}`, 105, 35, { align: 'center' });
            doc.text(`Período: ${formatDate(report.fecha_inicio)} - ${formatDate(report.fecha_final)}`, 105, 45, { align: 'center' });
            doc.text(`Generado el: ${report.fecha_creacion}`, 105, 55, { align: 'center' });

            const body = Object.entries(report.promedios).map(([sensor, valor]) => [sensor, valor]);

            doc.autoTable({
              startY: 70,
              head: [['Sensor', 'Promedio']],
              body,
              styles: { fontSize: 12 },
              headStyles: { fillColor: [67, 160, 71], textColor: [255, 255, 255] },
              alternateRowStyles: { fillColor: [240, 240, 240] }
            });

            doc.setFontSize(10);
            doc.setTextColor(150);
            doc.text('Sistema de Reportes Meteorológicos', 105, doc.internal.pageSize.height - 10, { align: 'center' });

            doc.save(`Reporte_${report.nombre.replace(/ /g, '_')}.pdf`);
          } catch (error) {
            console.error('Error generating PDF:', error);
            alert('Error al generar el PDF: ' + error.message);
          }
        }

        function deleteReport(id) {
          const savedReports = JSON.parse(localStorage.getItem('savedReports')) || [];
          const updatedReports = savedReports.filter(report => report.id_reporte.toString() !== id.toString());
          localStorage.setItem('savedReports', JSON.stringify(updatedReports));
          updateTable(updatedReports);
        }
        </script>
      
</body>
</html>
