<script>
    document.addEventListener("DOMContentLoaded", async () => {
    // --- 1. Cargar alertas ---
    async function cargarAlertas() {
        try {
            const response = await fetch("/alertas");
            if (!response.ok) throw new Error("Error al obtener alertas");

            const alertas = await response.json();
            const tablaBody = document.getElementById("tabla-alertas");
            tablaBody.innerHTML = ''; // Limpiar la tabla primero

            alertas.forEach(alerta => {
                const fila = document.createElement("tr");
                fila.classList.add("border-b", "border-bgray-300", "dark:border-darkblack-400");

                const estadoClase = alerta.activa
                    ? "bg-success-50 text-success-400 dark:bg-darkblack-500"
                    : "bg-[#FDF9E9] text-warning-300 dark:bg-darkblack-500";
                const estadoTexto = alerta.activa ? "Activo" : "Inactivo";

                fila.innerHTML = `
                    <td class="px-6 py-5 xl:px-0">
                        <div class="flex w-full items-center space-x-2.5">
                            <p class="text-base font-semibold text-bgray-900 dark:text-white">${alerta.nombre}</p>
                        </div>
                    </td>
                    <td class="px-6 py-5 xl:px-0">
                        <p class="text-base font-medium text-bgray-900 dark:text-white">${alerta.nombre_estacion}</p>
                    </td>
                    <td class="px-6 py-5 xl:px-0">
                        <p class="text-base font-medium text-bgray-900 dark:text-white">${alerta.tipo_sensor}</p>
                    </td>
                    <td class="px-6 py-5 xl:px-0">
                        <p class="text-base font-medium text-bgray-900 dark:text-white">${alerta.tipo_alerta}</p>
                    </td>
                    <td class="px-6 py-5 xl:px-0">
                        <p class="text-base font-medium text-bgray-900 dark:text-white">${alerta.valor_limite}</p>
                    </td>
                    <td class="px-6 py-5 xl:w-[165px] xl:px-0">
                        <div class="flex w-full items-center">
                            <span class="block rounded-md ${estadoClase} px-4 py-1.5 text-sm font-semibold leading-[22px]">${estadoTexto}</span>
                        </div>
                    </td>
                    <td class="px-6 py-5 xl:w-[165px] xl:px-0">
                        <div class="flex items-center space-x-3">
                            <button class="editar-alerta" data-id="${alerta.id_alerta}">
                                <img alt="Editar" class="w-5 h-5" src="src/assets/Edit.svg">
                            </button>
                        </div>
                    </td>
                `;
                tablaBody.appendChild(fila);
            });
            
            // Configurar los botones de editar después de agregar filas
            configureEditButtons();
            
        } catch (error) {
            console.error("Error al cargar alertas:", error);
        }
    }
    
    // Cargar alertas inicialmente
    await cargarAlertas();

    // Configurar botones de editar
    function configureEditButtons() {
        document.querySelectorAll('.editar-alerta').forEach(button => {
            button.addEventListener('click', async (e) => {
                const alertaId = e.currentTarget.dataset.id;
                console.log("Editar alerta:", alertaId);
                // Implementar lógica de edición
            });
        });
    }

    // --- 2. Abrir modal y cargar estaciones ---
    document.querySelectorAll('.modal-open').forEach(button => {
        button.addEventListener('click', async () => {
            const target = button.getAttribute('data-target');
            const modal = document.querySelector(target);
            if (modal) modal.classList.remove('hidden');

            // Obtener estaciones
            const selectEstacion = document.getElementById("selectEstacion");
            if (!selectEstacion) {
                console.error("Elemento selectEstacion no encontrado");
                return;
            }
            
            selectEstacion.innerHTML = '<option value="">--Selecciona estación--</option>'; // limpiar
            
            try {
                const res = await fetch("/estacionesUsuario");
                if (!res.ok) throw new Error("Error al obtener estaciones");
                
                const estaciones = await res.json();

                estaciones.forEach(estacion => {
                    const option = document.createElement("option");
                    option.value = estacion.id_estacion;
                    option.textContent = estacion.nombre;
                    selectEstacion.appendChild(option);
                });

                // No cargar sensores automáticamente, esperar a que el usuario elija una estación
                // Limpiar el selector de sensores
                const selectSensor = document.getElementById("selectSensor");
                if (selectSensor) {
                    selectSensor.innerHTML = '<option value="">--Elige un sensor--</option>';
                }

            } catch (error) {
                console.error("Error al cargar estaciones:", error);
            }
        });
    });

    // --- 3. Cerrar modal
    document.getElementById("step-1-cancel").addEventListener('click', () => {
    // Resetear formulario
    const form = document.querySelector('.step-content.step-1 form');
    if (form) form.reset();
    
    // Resetear el switch de estado
    const estadoSwitch = document.getElementById("estado_alerta");
    if (estadoSwitch) {
        estadoSwitch.setAttribute("aria-checked", "true");
        actualizarVisualSwitch(true); // Usa la función centralizada
    }
    
    // Cerrar modal completamente
    cerrarModalCompletamente();
});

    // --- 4. Cargar sensores al cambiar estación ---
    async function cargarSensores(idEstacion) {
        console.log("Cargando sensores para estación:", idEstacion);
        
        const selectSensor = document.getElementById("selectSensor");
        if (!selectSensor) {
            console.error("Elemento selectSensor no encontrado");
            return;
        }
        
        selectSensor.innerHTML = '<option value="">--Elige un sensor--</option>';

        if (!idEstacion) {
            console.log("No se seleccionó una estación válida");
            return;
        }

        try {
            const res = await fetch(`/sensoresEstacion/${idEstacion}`);
            if (!res.ok) throw new Error(`Error al obtener sensores: ${res.statusText}`);
            
            const sensores = await res.json();
            console.log("Sensores obtenidos:", sensores);

            if (sensores.length === 0) {
                const option = document.createElement("option");
                option.value = "";
                option.textContent = "--No hay sensores--";
                selectSensor.appendChild(option);
                return;
            }

            sensores.forEach(sensor => {
                const option = document.createElement("option");
                option.value = sensor.id_sensor;
                option.textContent = sensor.tipo;
                selectSensor.appendChild(option);
            });
        } catch (error) {
            console.error("Error al cargar sensores:", error);
            // Mostrar mensaje de error en el selector
            selectSensor.innerHTML = '<option value="">Error al cargar sensores</option>';
        }
    }

    // Eventos de cambio de estación
    const selectEstacion = document.getElementById("selectEstacion");
    if (selectEstacion) {
        selectEstacion.addEventListener("change", (e) => {
            const idEstacion = e.target.value;
            cargarSensores(idEstacion);
        });
    } else {
        console.warn("Elemento selectEstacion no encontrado para eventos de cambio");
    }

    // Verificar si existe el otro selector y agregar evento también
    const selectEstacionAlt = document.getElementById("select-estacion");
    if (selectEstacionAlt) {
        selectEstacionAlt.addEventListener("change", (e) => {
            const idEstacion = e.target.value;
            cargarSensores(idEstacion);
        });
    }

    // --- 5. Guardar alerta
    const agregarBoton = document.getElementById("agregar_boton");
    if (agregarBoton) {
    agregarBoton.addEventListener("click", async (e) => {
        e.preventDefault();
        console.log("Guardando alerta...");
        
        // Obtener los valores del formulario
        const descripcion = document.getElementById("descripcion")?.value;
        const idEstacion = document.getElementById("selectEstacion")?.value;
        const idSensor = document.getElementById("selectSensor")?.value;
        const tipoAlerta = document.getElementById("selectTipoAlerta")?.value;
        const limite = document.getElementById("limite_alerta")?.value;
        const estadoSwitch = document.getElementById("estado_alerta");
        const activa = estadoSwitch ? estadoSwitch.getAttribute("aria-checked") === "true" : true;

        // Validación básica
        if (!descripcion || !idEstacion || !idSensor || !tipoAlerta || !limite) {
            alert("Por favor, completa todos los campos obligatorios");
            return;
        }

        const datos = {
            descripcion,
            id_estacion: idEstacion,
            id_sensor: idSensor,
            tipo_alerta: tipoAlerta,
            valor_limite: limite,
            activa
        };

        console.log("Datos a enviar:", datos);

        try {
            const loadingElement = document.getElementById("loading-spinner"); // si tienes uno
            if (loadingElement) loadingElement.style.display = 'block';

            const res = await fetch("/guardarAlerta", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(datos)
            });

            if (!res.ok) {
                const errorText = await res.text();
                throw new Error(`Error al guardar la alerta: ${res.status} ${errorText}`);
            }

            const nuevaAlerta = await res.json();
            console.log("Alerta guardada:", nuevaAlerta);
            
            // Aquí se recarga la tabla de alertas con la nueva alerta
            await cargarAlertas(); 
            
            alert("Alerta guardada correctamente");

        } catch (error) {
            console.error("Error al guardar la alerta:", error);
            alert("Error al guardar la alerta. Revisa la consola para más detalles.");
        } finally {
            if (loadingElement) loadingElement.style.display = 'none';
            cerrarModalCompletamente(); // Asegura que el modal se cierre correctamente
        }
    });
}

    // --- 6. Manejar toggle de estado
    const estadoSwitch = document.getElementById("estado_alerta");
    if (estadoSwitch) {
        // Función para actualizar visualmente el switch según su estado
        function actualizarVisualSwitch(isActive) {
            if (isActive) {
                // Estado activo
                estadoSwitch.classList.add("bg-success-300");
                estadoSwitch.classList.remove("bg-[#9AA2B1]");
                const ball = estadoSwitch.querySelector("span");
                if (ball) {
                    ball.classList.add("translate-x-5");
                    ball.classList.remove("translate-x-0");
                }
            } else {
                // Estado inactivo
                estadoSwitch.classList.remove("bg-success-300");
                estadoSwitch.classList.add("bg-[#9AA2B1]");
                const ball = estadoSwitch.querySelector("span");
                if (ball) {
                    ball.classList.remove("translate-x-5");
                    ball.classList.add("translate-x-0");
                }
            }
        }

        // Inicializar switch como activo
        estadoSwitch.setAttribute("aria-checked", "true");
        actualizarVisualSwitch(true);
        
        // Evento de clic para cambiar estado
        estadoSwitch.addEventListener("click", () => {
            const currentState = estadoSwitch.getAttribute("aria-checked") === "true";
            const newState = !currentState;
            
            // Actualizar atributo
            estadoSwitch.setAttribute("aria-checked", String(newState));
            
            // Actualizar visual
            actualizarVisualSwitch(newState);
            
            console.log("Estado del switch cambiado a:", newState);
        });
    }

    function cerrarModalCompletamente() {
    // Cerrar el modal específico
    const modal = document.querySelector('.step-content.step-1');
    if (modal) modal.classList.add('hidden');
    
    // Eliminar cualquier overlay o blur que pueda estar presente
    const overlays = document.querySelectorAll('.modal-overlay, .overlay, .backdrop');
    overlays.forEach(overlay => overlay.classList.add('hidden'));
    
    // Si hay una clase específica que añade blur al contenido principal
    const mainContent = document.querySelector('main, #main-content, .main-content');
    if (mainContent) {
        mainContent.classList.remove('blurred', 'blur', 'filter-blur');
    }
    
    // Si hay un body con clase que impide scroll
    document.body.classList.remove('overflow-hidden', 'no-scroll');
}
});
</script>

    <script>
    document.addEventListener("DOMContentLoaded", () => {
      const btnEliminar = document.getElementById("btnEliminar");
      const modalEliminar = document.getElementById("delete-alert-modal");
      const btnCancelar = document.getElementById("cancel-delete");
      const overlayEliminar = modalEliminar.querySelector(".modal-overlay");
      const selectEliminar = document.getElementById("selectAlertaEliminar");
      const formEliminar = document.getElementById("formEliminarAlerta");
  
      // Mostrar el modal y cargar alertas
      btnEliminar.addEventListener("click", async () => {
        modalEliminar.classList.remove("hidden");
        await cargarAlertas();
      });
  
      // Cerrar modal
      const cerrarModal = () => modalEliminar.classList.add("hidden");
      btnCancelar.addEventListener("click", cerrarModal);
      overlayEliminar.addEventListener("click", cerrarModal);
  
      // Cargar alertas del backend
      async function cargarAlertas() {
        try {
          const response = await fetch("/alertaUsuario");
          if (!response.ok) throw new Error("Error al obtener alertas");
  
          const alertas = await response.json();
          selectEliminar.innerHTML = '<option value="">--Selecciona una alerta--</option>';
          alertas.forEach((alerta) => {
            const option = document.createElement("option");
            option.value = alerta.id_alerta;
            option.textContent = alerta.nombre;
            selectEliminar.appendChild(option);
          });
        } catch (error) {
          console.error(error);
          alert("No se pudieron cargar las alertas");
        }
      }
  
      // Enviar solicitud para eliminar alerta
      formEliminar.addEventListener("submit", async (e) => {
            e.preventDefault();
            const idAlerta = selectEliminar.value;

            if (!idAlerta) {
                alert("Selecciona una alerta");
                return;
            }

            try {
                const response = await fetch("/eliminarAlerta", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ idAlerta })
                });

                const text = await response.text();
                if (response.ok) {
                    alert(text);
                    cerrarModal();
                    
                    // Aquí actualizamos la tabla después de eliminar
                    actualizarTablaAlertas();
                } else {
                    alert("Error al eliminar alerta: " + text);
                }
            } catch (error) {
                console.error(error);
                alert("Error en la solicitud");
            }
        });
    });
  </script>

    <script>
    // Función para actualizar la tabla de alertas después de eliminar
    function actualizarTablaAlertas() {
        fetch('/alertaUsuario')
            .then((response) => response.json())
            .then((alertas) => {
                const tableBody = document.getElementById("tabla-alertas"); // Asegúrate de que este es el cuerpo de la tabla que usas
                tableBody.innerHTML = ''; // Limpiar la tabla antes de agregar las nuevas filas
                alertas.forEach((alerta) => {
                    const row = document.createElement('tr');
                    
                    const estadoClase = alerta.activa ? "bg-success-50 text-success-400 dark:bg-darkblack-500" : "bg-[#FDF9E9] text-warning-300 dark:bg-darkblack-500";
                    const estadoTexto = alerta.activa ? "Activo" : "Inactivo";
                    
                    row.innerHTML = `
                        <td>${alerta.nombre}</td>
                        <td>${alerta.nombre_estacion}</td>
                        <td>${alerta.tipo_sensor}</td>
                        <td>${alerta.tipo_alerta}</td>
                        <td>${alerta.valor_limite}</td>
                        <td class="px-6 py-5 xl:w-[165px] xl:px-0">
                            <div class="flex w-full items-center">
                                <span class="block rounded-md ${estadoClase} px-4 py-1.5 text-sm font-semibold leading-[22px]">${estadoTexto}</span>
                            </div>
                        </td>
                        <td>
                            <button class="editar-alerta" data-id="${alerta.id_alerta}">Editar</button>
                            <button class="eliminar-alerta" data-id="${alerta.id_alerta}">Eliminar</button>
                        </td>
                    `;
                    tableBody.appendChild(row);
                });
            })
            .catch((error) => console.error("Error al actualizar la tabla:", error));
    }
  </script>

</body>
</html>
